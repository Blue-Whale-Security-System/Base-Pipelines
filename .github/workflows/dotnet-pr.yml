name: Reusable .NET PR CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: false
        default: '8.0.x'
        type: string
      project-path:
        description: 'Path to the .NET project or solution file'
        required: true
        type: string
    secrets:
      NUGET_AUTH_TOKEN:
        description: 'Token with read:packages for cross-repo GitHub Packages (falls back to GITHUB_TOKEN)'
        required: false


jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Authenticate to GitHub Packages
        if: hashFiles('nuget.config') != ''
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          grep 'nuget.pkg.github.com' nuget.config | sed -n 's/.*key="\([^"]*\)".*/\1/p' | while read -r source; do
            dotnet nuget update source "$source" \
              --username "${{ github.actor }}" \
              --password "$NUGET_TOKEN" \
              --store-password-in-clear-text
          done

      - name: Restore dependencies
        run: dotnet restore ${{inputs.project-path}}

      - name: Build
        run: dotnet build ${{inputs.project-path}} --configuration Release --no-restore

      - name: Run xUnit tests
        run: >
          dotnet test ${{inputs.project-path}}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
